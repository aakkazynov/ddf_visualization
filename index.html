          <td class="num">${p.amount != null ? esc(fmtAmt(p.amount, p.approx)) : na("Not found")}</td>
          <td>${p.amount != null && p.basis ? esc(p.basis) : na("Not available")}</td>
          <td>${esc(WHERE_LABEL[p.where])}</td><td>${esc(p.countriesAll.map(cName).join(", "))}</td>
          <td class="num">${p.funders.length}</td><td>${sourcesHtml(p)}</td></tr>`).join("")}</tbody></table>`;
    } else {
      wrap.innerHTML = `<table class="tbl"><caption class="sr-only">Funders</caption><thead><tr>
        <th scope="col">Funder</th><th scope="col">Endowment</th><th scope="col">Endowment basis</th><th scope="col">Website</th>
        <th scope="col">Programs</th><th scope="col">Program names</th></tr></thead><tbody>${fs.map(f => {
          const ps = f.isDDF ? active : activeProgs(f);
          return `<tr><td><button class="linkish" data-funder="${esc(f.id)}">${esc(f.name)}</button>${f.hasAbroad ? `<span class="tag">abroad</span>` : ""}</td>
            <td class="num">${f.endow != null ? esc(fmtEndow(f.endow)) : na("Not found")}</td><td>${f.basis ? esc(f.basis) : ""}</td>
            <td>${extLink(f.website) || na("Not found")}</td><td class="num">${ps.length}</td>
            <td>${esc(ps.map(p => p.name).join("; "))}</td></tr>`; }).join("")}</tbody></table>`;
    }
    const toGraph = () => stage.scrollIntoView({ behavior: "smooth" });
    wrap.querySelectorAll("[data-prog]").forEach(b => b.onclick = () => { selectProgram(programs.find(p => p.id === b.dataset.prog)); toGraph(); });
    wrap.querySelectorAll("[data-funder]").forEach(b => b.onclick = () => { selectFunder(byId.get(b.dataset.funder)); toGraph(); });
  }

  // ------------------------------------------------------------ about text
  (function renderAbout() {
    const nBase = basePrograms.length, nAbroad = abroadPrograms.length;
    const nBaseF = funders.filter(f => f.inBase && !f.isDDF).length;
    const nExtraF = funders.filter(f => !f.inBase).length;
    const noEndow = funders.filter(f => f.inBase && !f.isDDF && f.endow == null).length;
    const nCountries = new Set(abroadPrograms.flatMap(p => p.countries)).size;
    document.getElementById("aboutBody").innerHTML = `
      <h3>What the graph shows</h3>
      <p>Each dot is a funder that co-funded at least one grant program with the Doris Duke Foundation (DDF). The ${nBase} programs and ${nBaseF} funders
      come from the DDF Funders Network research (${extLink(NET.source, "source page")}). The ${nAbroad} programs abroad come from separate research and are an optional layer.</p>
      <h3>Dot size and color</h3>
      <ul>
        <li><strong>Size</strong> is the funder's endowment tier: over $10 billion, over $1 billion, over $100 million, or below $100 million.
          Figures are FY23 assets under management where available, otherwise total assets from tax filings or annual reports; each funder's panel says which.</li>
        <li><strong>Small pale dots</strong> are funders whose endowment wasn't found (${noEndow} of ${nBaseF} in the US network, and all ${nExtraF} funders that appear only abroad). No figure is estimated.</li>
        <li><strong>Color</strong> is the DDF program area of the funder's programs; a funder in several areas is drawn as a small pie. The colors were checked to stay distinct for common color-vision deficiencies.</li>
        <li>DDF has a white ring. A <strong>dashed ring</strong> marks a funder with at least one program abroad.</li>
      </ul>
      <h3>Lines</h3>
      <ul>
        <li>A <strong>colored line from DDF</strong> is one shared program. Its width shows the program's total size (square-root scale); hover it for the program and amount.</li>
        <li>A <strong>dotted line</strong> means the program's amount wasn't found.</li>
        <li>A <strong>gray line</strong> joins two funders who co-funded the same program. Click it to see which programs they share.</li>
      </ul>
      <h3>Programs abroad</h3>
      <p>Turning on “Show programs abroad” adds ${nAbroad} programs where DDF and at least one other named funder put money into work outside the US, reaching ${nCountries} countries,
      plus ${nExtraF} funders not in the US network. It turns on by itself when you choose International or Both, a country outside the US, or a program abroad; Reset turns it off.</p>
      <ul>
        <li><strong>Where funds go:</strong> US only = the ${nBase} US programs; International = programs that fund work only abroad; Both = programs that also funded US work (for example two-way artist exchanges).</li>
        <li>The <strong>map</strong> is shaded by how many programs match the filters (the country filter itself is ignored so you can compare countries).</li>
      </ul>
      <h3>Caveats</h3>
      <ul>
        <li>Amounts measure different things (a multi-year commitment, a first round of grants, a cumulative total). “What the amount is” explains each one, so compare line widths with care.</li>
        <li>Endowment figures mix years and measures (assets under management vs. total assets).</li>
        <li>For programs abroad, the amount is the headline figure in the research notes (“~” marks an estimate), the year is the first year of the program's date range, and “funds US work” was judged from the research descriptions.
          Each has a confidence rating; Center Stage is borderline, as its money mainly paid for US tours. Some details rest on search summaries because older DDF pages are offline.</li>
        <li>Funder names are the short labels used in the research. The Mosaic Network and Fund lists its full funder roster, which may include funders who joined after DDF.</li>
        <li>The list is not exhaustive: it covers programs where a public source names DDF and at least one other funder.</li>
      </ul>`;
  })();

  // -------------------------------------------------------------------- go
  if (window.innerWidth < 720) document.getElementById("legend").open = false; // keep the small graph clear on phones
  drawShapes();
  renderChips();
  renderLegend();
  setYear(Y1, true);
  place();
  update();
  fit(false);
  loadMap();
  let rz;
  window.addEventListener("resize", () => {
    clearTimeout(rz);
    rz = setTimeout(() => { sizeStage(); drawShapes(); place(); restyle(); fit(false); drawMap(); }, 150);
  });
})();
</script>
</body>
</html>
